[build]
  functions = "netlify/functions"
  publish = "."
  command = "npm install"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Single-page app: the visual canvas is index.html at the root. No SPA routing
# rewrites needed (there are no client-side routes), but keep function calls and
# real files taking precedence over any future catch-all.
